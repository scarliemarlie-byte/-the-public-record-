# Decap CMS configuration for The Public Record.
# Edits go to the GitHub repo via Netlify's Git Gateway,
# which is why backend.name is "git-gateway".

backend:
  name: git-gateway
  branch: main

# Optional: enable a Drafts → In Review → Ready workflow.
# Comment this out if you want articles to publish immediately on save.
publish_mode: editorial_workflow

# Images uploaded via the editor land here.
media_folder: "assets/img"
public_folder: "assets/img"

# The site lives at the same origin as /admin (no separate display_url needed).
site_url: /
logo_url: /assets/img/logo.png

# ---------------------------------------------------------
# Collections
# ---------------------------------------------------------
collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    description: "Every story published on The Public Record. Pick the ‘featured’ box on exactly one article — that becomes the homepage lead."
    file: "assets/data/articles.json"
    format: "json"
    editor:
      preview: false
    fields:
      - label: "Articles"
        name: "articles"
        widget: "list"
        summary: "{{fields.title}} — {{fields.author}}, {{fields.date}}"
        fields:
          - { label: "Slug (URL part, lowercase, hyphens)", name: "slug", widget: "string", hint: "Example: mayor-renames-times-square" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Deck (one-sentence subtitle)", name: "deck", widget: "string", required: false }
          - label: "Section"
            name: "category"
            widget: "select"
            options:
              - { label: "Politics",   value: "politics" }
              - { label: "Culture",    value: "culture" }
              - { label: "Weird News", value: "weird-news" }
              - { label: "Internet",   value: "internet" }
              - { label: "Lifestyle",  value: "lifestyle" }
              - { label: "Opinion",    value: "opinion" }
          - { label: "Author / Byline", name: "author", widget: "string" }
          - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
          - { label: "Read time", name: "readTime", widget: "string", required: false, hint: "e.g. 5 min" }
          - { label: "Hero image", name: "image", widget: "image", required: false, allow_multiple: false }
          - { label: "Excerpt (1 short paragraph, shows on cards)", name: "excerpt", widget: "text" }
          - { label: "Lead story on homepage?", name: "featured", widget: "boolean", default: false, hint: "Only one article should be flagged. The most recent flagged article wins." }
          - { label: "Article body", name: "body", widget: "markdown", hint: "Write the full article here. Supports headings, bold, italics, quotes, links, images." }
